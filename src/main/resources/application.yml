spring:
  application:
    name: licensegraph
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      write-date-timestamps-as-nanoseconds: false
  # Persistence. Hibernate builds the tables from each module's @Entity classes; ddl-auto is set
  # per profile. docs/schema.sql documents the result. Flyway migrations are planned for
  # Iteration 2.
  jpa:
    open-in-view: false
  flyway:
    enabled: false
  profiles:
    # Falls back to the in-memory H2 profile unless -Dspring.profiles.active=postgres is given.
    default: test

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
