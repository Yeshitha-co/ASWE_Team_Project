spring:
  application:
    name: licensegraph
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      write-date-timestamps-as-nanoseconds: false

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
