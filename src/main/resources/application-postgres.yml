# PostgreSQL profile: persistent data for the demo and deployment.
# Credentials come from the environment and are never committed.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Creates missing tables and columns at startup and keeps existing data.
      ddl-auto: update
