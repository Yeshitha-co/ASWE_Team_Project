# Optional local PostgreSQL for the "postgres" profile, for anyone with Docker installed.
# Start with: docker compose up -d   (see the README's Database section)
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: licensegraph
      POSTGRES_USER: ${DB_USER:-licensegraph}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in your shell or .env}
    ports:
      - "5432:5432"
    volumes:
      - licensegraph-data:/var/lib/postgresql/data
volumes:
  licensegraph-data:
